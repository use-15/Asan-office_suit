[package]
name = "asan-office"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The name of the native library of this package.
name = "asan_office_lib"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
# docx-rs = "0.1" # Potential for high-fidelity DOCX

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }
